# agent-config.toml — declarative install of this repo's own MCP servers
# (witan, witan-code) and skill catalog (skills/**) via agent-config-kit's
# `ac-kit` CLI, for consumers that don't want to write Python.
#
# Skills owned by witan itself (mcp/servers/witan/witan/skills/) are
# installed by `witan setup`, not this manifest — witan owns its own
# registration lifecycle.
#
# Usage (from the repo root):
#   uv tool install 'agent-config-kit[cli]'
#   ac-kit apply agent-config.toml            # register on every detected platform
#   ac-kit apply agent-config.toml --dry-run   # preview without writing
#   ac-kit validate agent-config.toml          # check for drift
#
# Set WITAN_AUTHOR below to your own name before applying.

[mcp_servers.witan]
kind = "stdio"
command = "uvx"
args = [
    "--from",
    "git+https://github.com/mitodl/agent-kit#subdirectory=mcp/servers/witan",
    "--with",
    "git+https://github.com/mitodl/agent-kit#subdirectory=mcp/servers/witan-code",
    "witan",
    "serve",
]
env = { WITAN_AUTHOR = "<your-name>" }

[mcp_servers.witan-code]
kind = "stdio"
command = "uvx"
args = [
    "--from",
    "git+https://github.com/mitodl/agent-kit#subdirectory=mcp/servers/witan-code",
    "witan-code",
    "serve",
]
env = { WITAN_AUTHOR = "<your-name>" }

