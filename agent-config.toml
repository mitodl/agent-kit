# agent-config.toml — declarative install of this repo's skill catalog
# (skills/**) and the ToolHive SWE remote MCP servers, via
# agent-config-kit's `agent-kit` CLI, for consumers that don't want to
# write Python.
#
# witan and witan-code are NOT registered here — `witan setup` (see
# mcp/servers/witan/README.md) owns its own MCP registration and skill
# installation lifecycle; registering it a second time from this manifest
# would just duplicate that.
#
# ToolHive SWE has no local process to build or run — it's just three
# remote, Streamable HTTP servers (one per environment tier). Auth is
# Keycloak OAuth 2.1: the first call to each server opens a browser
# consent flow, so there is no token or API key to set here. Only want
# one or two tiers? Delete the [mcp_servers.toolhive-swe-*] table(s) you
# don't need before running `agent-kit apply` — each tier is a separate
# OAuth prompt and you likely only have Keycloak access to some of them.
#
# Profiles mirror the skills/ category layout (see AGENTS.md) so a
# consumer picks up just the skills relevant to their work, instead of
# the whole catalog. `universal` (validate-before-commit, creating-skills,
# create-ol-pull-request) is what every other profile inherits — it's the
# baseline useful regardless of specialty. Selecting no profile installs
# everything, including the ToolHive SWE tiers (profiles are opt-in
# filters, not gates).
#
# Usage (from the repo root):
#   uv tool install 'agent-config-kit[cli]'
#   agent-kit apply agent-config.toml                    # everything, every platform
#   agent-kit apply agent-config.toml --profile python   # just the python profile
#   agent-kit apply agent-config.toml --dry-run          # preview without writing
#   agent-kit validate agent-config.toml                 # check for drift
#   agent-kit profiles agent-config.toml                 # list profiles + entry counts

[mcp_servers.toolhive-swe-ci]
kind = "remote"
url = "https://toolhive-swe.ci.ol.mit.edu/mcp"
transport = "http"

[mcp_servers.toolhive-swe-qa]
kind = "remote"
url = "https://toolhive-swe.qa.ol.mit.edu/mcp"
transport = "http"

[mcp_servers.toolhive-swe-prod]
kind = "remote"
url = "https://toolhive-swe.ol.mit.edu/mcp"
transport = "http"

[skills]
create-ol-github-issue          = "skills/process/create-ol-github-issue/SKILL.md"
create-ol-pull-request          = "skills/process/create-ol-pull-request/SKILL.md"
create-ol-rfc-discussion        = "skills/process/create-ol-rfc-discussion/SKILL.md"
creating-skills                 = "skills/workflow/creating-skills/SKILL.md"
cyclopts-cli-scripts            = "skills/python/cyclopts-cli-scripts/SKILL.md"
dagster-code-location-structure = "skills/dagster/dagster-code-location-structure/SKILL.md"
dependency-pruning              = "skills/process/dependency-pruning/SKILL.md"
dependency-updates              = "skills/process/dependency-updates/SKILL.md"
docker-uv-image-builds          = "skills/containers/docker-uv-image-builds/SKILL.md"
generate-standup                = "skills/process/generate-standup/SKILL.md"
github-issue-triage             = "skills/process/github-issue-triage/SKILL.md"
github-pr-triage                = "skills/process/github-pr-triage/SKILL.md"
pulumi-modify-existing          = "skills/infrastructure/pulumi-modify-existing/SKILL.md"
screenshot-pr                   = "skills/process/screenshot-pr/SKILL.md"
uv-python-workflow               = "skills/python/uv-python-workflow/SKILL.md"
validate-before-commit          = "skills/workflow/validate-before-commit/SKILL.md"
vault-k8s-auth                  = "skills/infrastructure/vault-k8s-auth/SKILL.md"

[profiles.universal]
skills = [
    "validate-before-commit",
    "creating-skills",
    "create-ol-pull-request",
    "create-ol-github-issue",
    "create-ol-rfc-discussion",
    "generate-standup",
]

[profiles.python]
inherits = ["universal"]
skills = ["cyclopts-cli-scripts", "uv-python-workflow"]

[profiles.infrastructure]
inherits = ["universal"]
skills = ["pulumi-modify-existing", "vault-k8s-auth", "docker-uv-image-builds"]

[profiles.data]
inherits = ["universal"]
skills = ["dagster-code-location-structure"]

[profiles.process]
inherits = ["universal"]
skills = [
    "dependency-pruning",
    "dependency-updates",
    "github-issue-triage",
    "github-pr-triage",
    "screenshot-pr",
]
