name: agent-config-kit tests

# Path-filter rule: a workflow must trigger on every workspace dependency it
# resolves, not just its own directory, plus the workspace resolution inputs
# (root pyproject.toml `members` and uv.lock — `uv sync` walks up to the
# workspace root, so those govern what every package resolves). Otherwise a
# change to a shared package is green on its own tests alone.
on:
  push:
    branches: [main]
    paths:
      - "packages/agent-config-kit/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/agent-config-kit-tests.yml"
  pull_request:
    paths:
      - "packages/agent-config-kit/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/agent-config-kit-tests.yml"

permissions:
  contents: read

jobs:
  test-agent-config-kit:
    name: agent-config-kit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent-config-kit

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-caching: true
          cache-dependency-glob: "packages/agent-config-kit/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --group test

      - name: Run tests
        run: uv run pytest

      - name: Lint (ruff check)
        # Pinned to match the ruff-pre-commit rev in prek.toml so CI and
        # local hooks enforce the same rules.
        run: uvx ruff@0.15.15 check .

      - name: Lint (ruff format)
        run: uvx ruff@0.15.15 format --check .
