name: Publish agent-config-kit to PyPI

on:
  push:
    branches: ["main"]
    paths:
      - "packages/agent-config-kit/pyproject.toml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: packages/agent-config-kit
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "packages/agent-config-kit/uv.lock"

      - name: Read version from pyproject.toml
        id: version
        run: |
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=agent-config-kit-v$version" >> "$GITHUB_OUTPUT"

      - name: Check for a new version
        id: check
        # A push can touch pyproject.toml without bumping the version (e.g.
        # a dependency edit); only publish when this version hasn't been
        # tagged/released yet.
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "$tag already exists — nothing new to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.new == 'true'
        run: uv sync --frozen --group test

      - name: Run tests
        if: steps.check.outputs.new == 'true'
        run: uv run pytest

      - name: Build
        if: steps.check.outputs.new == 'true'
        run: uv build

      - name: Publish to PyPI
        if: steps.check.outputs.new == 'true'
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: packages/agent-config-kit/dist

      - name: Tag the release
        # Only after a successful publish, so a tag always means "this
        # version is actually on PyPI" — never left dangling by a failed
        # test/build/publish step.
        if: steps.check.outputs.new == 'true'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git tag "$tag"
          git push origin "$tag"
