---
name: Validate skills

"on":
  pull_request:
    paths:
      - "skills/**"
      - "mcp/servers/witan/witan/skills/**"
      - "scripts/check-witan-skills-sync.sh"
      - ".github/workflows/validate-skills.yml"
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - "mcp/servers/witan/witan/skills/**"
      - "scripts/check-witan-skills-sync.sh"
      - ".github/workflows/validate-skills.yml"

permissions:
  contents: read

jobs:
  witan-skill-mirrors:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Check Witan skill mirrors
        run: scripts/check-witan-skills-sync.sh
