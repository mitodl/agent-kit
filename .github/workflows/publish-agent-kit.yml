name: Publish ol-agent-kit to PyPI

on:
  push:
    branches: ["main"]
    paths:
      - "packages/agent-kit/pyproject.toml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: packages/agent-kit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Read version from pyproject.toml
        id: version
        run: |
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=ol-agent-kit-v$version" >> "$GITHUB_OUTPUT"

      - name: Check for a new version
        id: check
        # A push can touch pyproject.toml without bumping the version (e.g.
        # a dependency edit); only publish when this version hasn't been
        # tagged/released yet.
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "$tag already exists — nothing new to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.new == 'true'
        run: uv sync --frozen --group test

      - name: Run tests
        if: steps.check.outputs.new == 'true'
        run: uv run pytest

      - name: Build
        if: steps.check.outputs.new == 'true'
        # uv build defaults to the workspace root's dist/ when run from a
        # workspace member directory; pin it to the member's own dist/ so the
        # publish step's packages-dir actually finds the artifacts.
        run: uv build -o dist

      - name: Publish to PyPI
        if: steps.check.outputs.new == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/agent-kit/dist

      - name: Tag the release
        # Only after a successful publish, so a tag always means "this
        # version is actually on PyPI" — never left dangling by a failed
        # test/build/publish step.
        if: steps.check.outputs.new == 'true'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git tag "$tag"
          git push origin "$tag"
