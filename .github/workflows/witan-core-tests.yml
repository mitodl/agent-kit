name: witan-core tests

on:
  push:
    branches: [main]
    paths:
      - "packages/witan-core/**"
      - ".github/workflows/witan-core-tests.yml"
  pull_request:
    paths:
      - "packages/witan-core/**"
      - ".github/workflows/witan-core-tests.yml"

permissions:
  contents: read

jobs:
  test-witan-core:
    name: witan-core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/witan-core

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "packages/witan-core/uv.lock"

      # The test suite is hermetic — the omnigraph installer tests monkeypatch
      # download/extract and never touch the network or a real binary — so no
      # binary-install step is needed here (unlike the server jobs).
      - name: Install dependencies
        run: uv sync --frozen --group test

      - name: Run tests
        run: uv run pytest

      - name: Lint (ruff check)
        # Pinned to match the ruff-pre-commit rev in prek.toml so CI and
        # local hooks enforce the same rules.
        run: uvx ruff@0.15.15 check .

      - name: Lint (ruff format)
        run: uvx ruff@0.15.15 format --check .
