name: witan-core tests

# Path-filter rule: a workflow must trigger on every workspace dependency it
# resolves, not just its own directory, plus the workspace resolution inputs
# (root pyproject.toml `members` and uv.lock — `uv sync` walks up to the
# workspace root, so those govern what every package resolves). Otherwise a
# change to a shared package is green on its own tests alone.
on:
  push:
    branches: [main]
    paths:
      - "packages/witan-core/**"
      - "packages/agent-config-kit/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/witan-core-tests.yml"
  pull_request:
    paths:
      - "packages/witan-core/**"
      - "packages/agent-config-kit/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/witan-core-tests.yml"

permissions:
  contents: read

jobs:
  test-witan-core:
    name: witan-core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/witan-core

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "packages/witan-core/uv.lock"

      # The test suite is hermetic — the omnigraph installer tests monkeypatch
      # download/extract and never touch the network or a real binary — so no
      # binary-install step is needed here (unlike the server jobs).
      - name: Install dependencies
        run: uv sync --frozen --group test

      - name: Run tests
        run: uv run pytest

      - name: Lint (ruff check)
        # Pinned to match the ruff-pre-commit rev in prek.toml so CI and
        # local hooks enforce the same rules.
        run: uvx ruff@0.15.15 check .

      - name: Lint (ruff format)
        run: uvx ruff@0.15.15 format --check .
