name: Tag release

on:
  push:
    branches: ["main"]
    paths:
      - "packages/agent-config-kit/pyproject.toml"
      - "mcp/servers/witan/pyproject.toml"
      - "mcp/servers/witan-code/pyproject.toml"

jobs:
  agent-config-kit:
    name: Tag agent-config-kit on version bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.tag.outputs.created }}
    defaults:
      run:
        working-directory: packages/agent-config-kit
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0

      - name: Read version from pyproject.toml
        id: version
        run: |
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag and push if new
        id: tag
        run: |
          tag="agent-config-kit-v${{ steps.version.outputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists, skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          echo "created=true" >> "$GITHUB_OUTPUT"

  publish-agent-config-kit:
    name: Publish agent-config-kit
    needs: agent-config-kit
    if: needs.agent-config-kit.outputs.created == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-agent-config-kit.yml

  witan:
    name: Tag witan-council on version bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.tag.outputs.created }}
    defaults:
      run:
        working-directory: mcp/servers/witan
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0

      - name: Read version from pyproject.toml
        id: version
        run: |
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag and push if new
        id: tag
        run: |
          tag="witan-council-v${{ steps.version.outputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists, skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          echo "created=true" >> "$GITHUB_OUTPUT"

  publish-witan:
    name: Publish witan-council
    needs: witan
    if: needs.witan.outputs.created == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-witan.yml

  witan-code:
    name: Tag witan-code on version bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.tag.outputs.created }}
    defaults:
      run:
        working-directory: mcp/servers/witan-code
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0

      - name: Read version from pyproject.toml
        id: version
        run: |
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag and push if new
        id: tag
        run: |
          tag="witan-code-v${{ steps.version.outputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists, skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          echo "created=true" >> "$GITHUB_OUTPUT"

  publish-witan-code:
    name: Publish witan-code
    needs: witan-code
    if: needs.witan-code.outputs.created == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-witan-code.yml
