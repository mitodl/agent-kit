name: Publish witan-code to PyPI

on:
  push:
    tags:
      - "witan-code-v*"
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/servers/witan-code
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-caching: true
          cache-dependency-glob: "mcp/servers/witan-code/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --group test

      - name: Run tests
        run: uv run pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: mcp/servers/witan-code
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0

      - name: Check tag matches pyproject.toml version
        # Only meaningful for a direct tag push. A workflow_call from
        # tag-release.yml runs in the context of the push-to-main event that
        # triggered the whole run, so github.event_name is still 'push' here
        # too (GITHUB_REF_NAME is 'main', not the tag) — github.ref_type is
        # the only reliable signal that this run's ref is actually a tag.
        if: github.ref_type == 'tag'
        run: |
          tag_version="${GITHUB_REF_NAME#witan-code-v}"
          pkg_version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag version ($tag_version) does not match pyproject.toml version ($pkg_version)"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: mcp/servers/witan-code/dist
