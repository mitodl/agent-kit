name: witan tests

on:
  push:
    branches: [main]
    paths:
      - "mcp/servers/witan/**"
      - "mcp/servers/witan-code/**"
      - ".github/workflows/witan-tests.yml"
  pull_request:
    paths:
      - "mcp/servers/witan/**"
      - "mcp/servers/witan-code/**"
      - ".github/workflows/witan-tests.yml"

permissions:
  contents: read

jobs:
  test-witan:
    name: witan (memory + CLI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/servers/witan

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-caching: true
          cache-dependency-glob: "mcp/servers/witan/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --group test

      - name: Cache omnigraph binary
        id: cache-omnigraph
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/omnigraph
          key: omnigraph-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mcp/servers/witan/witan/setup.py') }}

      - name: Install omnigraph binary
        # witan/server.py bootstraps a local graph at import time, so the
        # binary must exist before pytest even collects tests — no more
        # build-time bundling (see witan/setup.py), so fetch it explicitly.
        # Skipped on a cache hit: the cache key is tied to setup.py's
        # content, so a version bump (_OMNIGRAPH_VERSION) invalidates it
        # automatically instead of pinning CI to a stale binary.
        if: steps.cache-omnigraph.outputs.cache-hit != 'true'
        run: uv run python -c "from witan.setup import install_omnigraph; install_omnigraph(dry_run=False)"

      - name: Run tests
        run: uv run pytest -v

  witan-policy:
    name: witan (Cedar policy bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/servers/witan

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-caching: true
          cache-dependency-glob: "mcp/servers/witan/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --group test

      - name: Cache omnigraph binary
        id: cache-omnigraph
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/omnigraph
          key: omnigraph-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mcp/servers/witan/witan/setup.py') }}

      - name: Install omnigraph binary
        # policy check.sh shells out to the pinned omnigraph binary for
        # `cluster apply` / `policy validate` / `policy test`. Skipped on a
        # cache hit — see the cache-omnigraph step above.
        if: steps.cache-omnigraph.outputs.cache-hit != 'true'
        run: uv run python -c "from witan.setup import install_omnigraph; install_omnigraph(dry_run=False)"

      - name: Validate + test Cedar policy bundle
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ./policy/check.sh

  test-witan-code:
    name: witan-code (code graph)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/servers/witan-code

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-caching: true
          cache-dependency-glob: "mcp/servers/witan-code/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --group test

      - name: Run tests
        run: uv run pytest -v
