name: witan tests

on:
  push:
    branches: [main]
    paths:
      - "mcp/servers/witan/**"
      - "mcp/servers/witan-code/**"
      - ".github/workflows/witan-tests.yml"
  pull_request:
    paths:
      - "mcp/servers/witan/**"
      - "mcp/servers/witan-code/**"
      - ".github/workflows/witan-tests.yml"

permissions:
  contents: read

jobs:
  test-witan:
    name: witan (memory + CLI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/servers/witan

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-caching: true
          cache-dependency-glob: "mcp/servers/witan/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --group test

      - name: Install omnigraph binary
        # witan/server.py bootstraps a local graph at import time, so the
        # binary must exist before pytest even collects tests — no more
        # build-time bundling (see witan/setup.py), so fetch it explicitly.
        run: uv run python -c "from witan.setup import install_omnigraph; install_omnigraph(dry_run=False)"

      - name: Run tests
        run: uv run pytest -v

  test-witan-code:
    name: witan-code (code graph)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/servers/witan-code

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-caching: true
          cache-dependency-glob: "mcp/servers/witan-code/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --group test

      - name: Run tests
        run: uv run pytest -v
