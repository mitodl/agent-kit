name: witan-vscode

# The VS Code extension (packages/witan-vscode). `build` is the TypeScript
# gate and packages the .vsix; `smoke` installs that .vsix's contents in a
# pinned VS Code and drives it against a real `witan lsp`, so a server change
# that breaks the launch contract or a list command's shape is caught here too.
on:
  push:
    branches: [main]
    paths: &vscode_paths
      - "packages/witan-vscode/**"
      - ".github/workflows/witan-vscode.yml"
      # What the smoke test's server is built from.
      - "packages/witan-core/witan_core/**"
      - "mcp/servers/witan/witan/**"
      - "mcp/servers/witan/queries/**"
      - "mcp/servers/witan/schema/**"
      - "mcp/servers/witan-code/witan_code/**"
      # The board panel loads the web UI bundle the server ships.
      - "mcp/servers/witan/ui/**"
      - "uv.lock"
  pull_request:
    paths: *vscode_paths

permissions:
  contents: read

jobs:
  build:
    name: witan-vscode (typecheck, lint, test, package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/witan-vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: packages/witan-vscode/.node-version
          cache: npm
          cache-dependency-path: packages/witan-vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Package
        run: npm run package

  smoke:
    name: witan-vscode (the .vsix in VS Code against witan lsp)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/witan-vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: packages/witan-vscode/.node-version
          cache: npm
          cache-dependency-path: packages/witan-vscode/package-lock.json

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Cache omnigraph binary
        id: cache-omnigraph
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/omnigraph
          key: omnigraph-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/witan-core/witan_core/omnigraph_install.py') }}

      - name: Install omnigraph binary
        if: steps.cache-omnigraph.outputs.cache-hit != 'true'
        working-directory: .
        run: uv run --package witan-core python -c "from witan_core.omnigraph_install import install_omnigraph; install_omnigraph(dry_run=False)"

      - name: Cache the VS Code download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/witan-vscode/.vscode-test/vscode-*
          key: vscode-${{ runner.os }}-${{ hashFiles('packages/witan-vscode/test/smoke/run.mjs') }}

      - name: Install dependencies
        run: npm ci

      - name: Package
        run: npm run package

      - name: Build the web UI bundle
        # The smoke venv's witan is this checkout, installed editable, and the
        # board panel opens the bundle it ships, which git does not carry.
        working-directory: mcp/servers/witan/ui
        run: npm ci && npm run build

      - name: Smoke test
        # The pinned VS Code release is in test/smoke/run.mjs (VSCODE_VERSION),
        # and the smoke suite asserts the Copilot handoff command exists in it.
        run: xvfb-run -a npm run smoke
