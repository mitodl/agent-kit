name: Publish witan-council to PyPI

on:
  push:
    branches: ["main"]
    paths:
      - "mcp/servers/witan/pyproject.toml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: mcp/servers/witan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Read version from pyproject.toml
        id: version
        run: |
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=witan-council-v$version" >> "$GITHUB_OUTPUT"

      - name: Check for a new version
        id: check
        # A push can touch pyproject.toml without bumping the version (e.g.
        # a dependency edit); only publish when this version hasn't been
        # tagged/released yet.
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "$tag already exists — nothing new to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.new == 'true'
        run: uv sync --frozen --group test

      - name: Install omnigraph binary
        # witan/server.py bootstraps a local graph at import time, so the
        # binary must exist before pytest even collects tests.
        if: steps.check.outputs.new == 'true'
        run: uv run python -c "from witan_core.omnigraph_install import install_omnigraph; install_omnigraph(dry_run=False)"

      - name: Run tests
        if: steps.check.outputs.new == 'true'
        run: uv run pytest

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.check.outputs.new == 'true'
        with:
          node-version-file: mcp/servers/witan/ui/.node-version
          cache: npm
          cache-dependency-path: mcp/servers/witan/ui/package-lock.json

      - name: Build the UI bundle
        # Before `uv build`: the bundle is a gitignored build output that hatch
        # picks up through `artifacts` (pyproject.toml), so a release that
        # skipped this step would publish a wheel with no UI in it and nothing
        # would fail. The assertion below is what makes that impossible.
        if: steps.check.outputs.new == 'true'
        working-directory: mcp/servers/witan/ui
        run: |
          npm ci
          npm run build

      - name: Build
        if: steps.check.outputs.new == 'true'
        # uv build defaults to the workspace root's dist/ when run from a
        # workspace member directory; pin it to the member's own dist/ so the
        # publish step's packages-dir actually finds the artifacts.
        run: uv build -o dist

      - name: Assert the wheel carries the UI bundle
        # The failure this exists for is silent: hatch omits a missing
        # `artifacts` path without complaint, `uv build` succeeds, and the
        # release ships a witan whose /ui/ routes have nothing to serve. Check
        # the WHEEL rather than the working tree — `uv build` builds it from
        # the sdist, so the bundle has to survive both steps to be in there.
        if: steps.check.outputs.new == 'true'
        run: |
          wheel="$(ls dist/*.whl)"
          # The listing goes into a variable rather than through `| grep -q`:
          # grep exits on the first match and closes the pipe, so `unzip` can
          # take SIGPIPE and, under `pipefail`, fail the step that just found
          # what it wanted. Not reachable under this workflow's default
          # `bash -e`, but the cost of getting it wrong here is a blocked
          # release.
          listing="$(unzip -l "$wheel")"
          if ! grep -q 'witan/ui_dist/index.html' <<<"$listing"; then
            echo "::error::$wheel has no witan/ui_dist/index.html: the UI build did not reach the wheel"
            echo "$listing"
            exit 1
          fi

      - name: Publish to PyPI
        if: steps.check.outputs.new == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: mcp/servers/witan/dist

      - name: Tag the release
        # Only after a successful publish, so a tag always means "this
        # version is actually on PyPI" — never left dangling by a failed
        # test/build/publish step.
        if: steps.check.outputs.new == 'true'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git tag "$tag"
          git push origin "$tag"
