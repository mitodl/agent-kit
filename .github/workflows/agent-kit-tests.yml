name: agent-kit tests

# Path-filter rule: a workflow must trigger on every workspace dependency it
# resolves, not just its own directory, plus the workspace resolution inputs
# (root pyproject.toml `members` and uv.lock — `uv sync` walks up to the
# workspace root, so those govern what every package resolves). Otherwise a
# change to a shared package is green on its own tests alone.
on:
  push:
    branches: [main]
    paths:
      - "packages/agent-kit/**"
      - "packages/agent-config-kit/**"
      - "packages/witan-core/**"
      - "mcp/servers/witan/**"
      - "mcp/servers/witan-code/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/agent-kit-tests.yml"
  pull_request:
    paths:
      - "packages/agent-kit/**"
      - "packages/agent-config-kit/**"
      - "packages/witan-core/**"
      - "mcp/servers/witan/**"
      - "mcp/servers/witan-code/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/agent-kit-tests.yml"

permissions:
  contents: read

jobs:
  test-agent-kit:
    name: agent-kit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent-kit

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-caching: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --group test

      - name: Run tests
        run: uv run pytest

      - name: Lint (ruff check)
        # Pinned to match the ruff-pre-commit rev in prek.toml so CI and
        # local hooks enforce the same rules.
        run: uvx ruff@0.16.10 check .

      - name: Lint (ruff format)
        run: uvx ruff@0.16.10 format --check .
