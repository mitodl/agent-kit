name: witan editors

# Neovim, eglot and lsp-mode against a real `witan lsp`, each loading the
# config blocks from the editor guide (mcp/servers/witan/docs/editors.md). A
# guide edit that breaks a block, or a server change that breaks a feature the
# guide says works in a non-VS Code client, fails here. The VS Code extension
# has its own smoke job in witan-vscode.yml; these paths are that job's server
# paths plus the guide and the drivers.
on:
  push:
    branches: [main]
    paths: &editor_paths
      - "mcp/servers/witan/docs/editors.md"
      - "mcp/servers/witan/tests/editors/**"
      - ".github/workflows/witan-editors.yml"
      # What the server under test is built from.
      - "packages/witan-core/witan_core/**"
      - "mcp/servers/witan/witan/**"
      - "mcp/servers/witan/queries/**"
      - "mcp/servers/witan/schema/**"
      - "mcp/servers/witan-code/witan_code/**"
      - "uv.lock"
      # The checks import REAL_HOME from it, and pytest loads it first.
      - "testsupport/hermetic.py"
  pull_request:
    paths: *editor_paths

permissions:
  contents: read

env:
  # The guide asks for Neovim 0.12 or later and Emacs 30 or later. Emacs is
  # the floor; Neovim is the release the guide was checked with.
  NVIM_VERSION: v0.12.6
  NVIM_SHA256: 474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87
  EMACS_VERSION: "30.2"

jobs:
  editors:
    name: witan editors (Neovim, eglot, lsp-mode against witan lsp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Cache omnigraph binary
        id: cache-omnigraph
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/omnigraph
          key: omnigraph-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/witan-core/witan_core/omnigraph_install.py') }}

      - name: Install omnigraph binary
        if: steps.cache-omnigraph.outputs.cache-hit != 'true'
        run: uv run --frozen --package witan-core python -c "from witan_core.omnigraph_install import install_omnigraph; install_omnigraph(dry_run=False)"

      - name: Install Neovim
        run: |
          curl -fsSLo "$RUNNER_TEMP/nvim.tar.gz" "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz"
          echo "$NVIM_SHA256  $RUNNER_TEMP/nvim.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: ${{ env.EMACS_VERSION }}

      - name: Install lsp-mode from MELPA
        # Outside HOME, so the checks' own HOME starts empty. MELPA builds
        # from each package's default branch and keeps no old versions, so
        # this is whatever lsp-mode is current; the version is in the log.
        env:
          LSP_MODE_DIR: ${{ runner.temp }}/lsp-mode
        run: emacs --batch -Q -l mcp/servers/witan/tests/editors/install_lsp_mode.el

      - name: Editor checks
        # WITAN_EDITOR_CHECKS turns the suite on, and makes a missing editor a
        # failure rather than a skip. ol-agent-kit is what the guide installs:
        # witan and witan-code with their lsp extras.
        env:
          WITAN_EDITOR_CHECKS: "1"
          LSP_MODE_DIR: ${{ runner.temp }}/lsp-mode
        run: |
          nvim --version | head -1
          emacs --version | head -1
          uv run --frozen --isolated --package ol-agent-kit --group test pytest mcp/servers/witan/tests/editors -v
