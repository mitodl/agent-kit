name: omnigraph patched CLI

# The omnigraph-server image can build its CLI from the release source plus
# docker/patches/omnigraph-cli-inline-s3-root.patch (see OMNIGRAPH_CLI_SOURCE
# in the Dockerfile). Concourse builds the image with the Dockerfile's
# defaults, so until the 0.14 pin bump selects that stage nothing else builds
# it. This builds the image with it selected and qualifies its CLI against a
# copy of a cluster root on S3.
#
# The S3 here is RustFS in a container, not AWS: CI holds no AWS credentials,
# so qualification against a copy of a real deployed root is left to QA.
on:
  push:
    branches: [main]
    paths: &patched_cli_paths
      - "docker/omnigraph-server.Dockerfile"
      - "docker/patches/**"
      - ".dockerignore"
      - "bin/qualify_omnigraph_cli_s3.py"
      - ".github/workflows/omnigraph-cli-patch.yml"
  pull_request:
    paths: *patched_cli_paths

permissions:
  contents: read

jobs:
  qualify:
    name: omnigraph patched CLI (image builds, S3 root qualifies)
    runs-on: ubuntu-latest
    # A cold cargo build of the CLI is most of this; the gha cache below skips
    # it whenever the base commit, the patch and the toolchain are unchanged.
    timeout-minutes: 120
    env:
      AWS_ACCESS_KEY_ID: omnigraphci
      AWS_SECRET_ACCESS_KEY: omnigraphci-secret
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_ENDPOINT_URL_S3: http://127.0.0.1:9000
      AWS_ALLOW_HTTP: "true"
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_EC2_METADATA_DISABLED: "true"
      BUCKET: omnigraph-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image with the patched CLI
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/omnigraph-server.Dockerfile
          build-args: OMNIGRAPH_CLI_SOURCE=patched
          load: true
          tags: omnigraph-server:patched-cli
          cache-from: type=gha,scope=omnigraph-cli-patch
          cache-to: type=gha,scope=omnigraph-cli-patch,mode=max

      - name: Run the CLI from the image
        # The qualification drives the image's own /usr/local/bin/omnigraph,
        # so what passes is the binary the runtime stage copied in, on the
        # glibc it was built for (trixie's, newer than the runner's). The work
        # directory is mounted at the same path so file:// roots and --config
        # paths mean the same thing on both sides.
        run: |
          set -euo pipefail
          label=$(docker image inspect omnigraph-server:patched-cli \
            --format '{{ index .Config.Labels "edu.mit.ol.omnigraph.cli-source" }}')
          [[ "$label" == patched ]] || { echo "::error::cli-source label is '$label'"; exit 1; }
          mkdir -p "$RUNNER_TEMP/work"
          cat > "$RUNNER_TEMP/omnigraph" <<EOF
          #!/usr/bin/env bash
          exec docker run --rm --network host --user "$(id -u):$(id -g)" \
            -e HOME="$RUNNER_TEMP/work" -v "$RUNNER_TEMP/work:$RUNNER_TEMP/work" \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_REGION -e AWS_ENDPOINT_URL \
            -e AWS_ENDPOINT_URL_S3 -e AWS_ALLOW_HTTP -e AWS_S3_FORCE_PATH_STYLE \
            --entrypoint /usr/local/bin/omnigraph omnigraph-server:patched-cli "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/omnigraph"
          "$RUNNER_TEMP/omnigraph" --version
          docker image ls omnigraph-server:patched-cli

      - name: Start RustFS
        # The image and digest upstream's own S3 suite pins (ci.yml, job
        # rustfs_integration), which #1189's e2e test ran against.
        run: |
          docker run -d --name rustfs -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY="$AWS_ACCESS_KEY_ID" \
            -e RUSTFS_SECRET_KEY="$AWS_SECRET_ACCESS_KEY" \
            rustfs/rustfs:1.0.0-beta.12@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21 \
            /data
          for attempt in $(seq 1 30); do
            aws s3api list-buckets >/dev/null 2>&1 && break
            echo "RustFS not ready (${attempt}/30)"
            sleep 2
          done
          aws s3api create-bucket --bucket "$BUCKET"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Qualify the CLI against a copy of a cluster root on S3
        env:
          TMPDIR: ${{ runner.temp }}/work
        run: >-
          uv run --package witan-core --extra cli python bin/qualify_omnigraph_cli_s3.py
          --binary "$RUNNER_TEMP/omnigraph" --bucket "$BUCKET"
