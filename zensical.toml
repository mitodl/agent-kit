# Zensical configuration for the witan-context documentation site.
#
# Zensical is the Material for MkDocs team's successor generator; Material
# itself entered maintenance mode in early 2026. The config is MkDocs-shaped
# (same nav structure, same markdown extensions) so a fall back to
# mkdocs-material stays cheap if a plugin gap bites — which is also why this
# site deliberately uses no plugins.
#
# Build:  zensical build     (output in site/)
# Serve:  zensical serve     (incremental; rebuilds only changed files)

[project]
site_name = "witan-context"
site_description = "Shared memory, work coordination, and a code graph for coding agents."
site_author = "MIT Open Learning"

# Read the Docs does not yet support variable interpolation in Zensical config,
# so this is the literal published URL rather than $READTHEDOCS_CANONICAL_URL.
# It sets the canonical link tag; getting it wrong costs search ranking, not a
# broken build, so it fails quietly — check it after the first deploy.
site_url = "https://witan-context.readthedocs.io/"

repo_url = "https://github.com/mitodl/agent-kit"
repo_name = "mitodl/agent-kit"
edit_uri = "edit/main/docs/"

copyright = "Copyright &copy; 2026 MIT Open Learning"

nav = [
