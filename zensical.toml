  { "Get started" = [
    { "Overview" = "getting-started/index.md" },
    { "Installation" = "getting-started/installation.md" },
    { "Your first memory" = "getting-started/first-memory.md" },
    { "Tasks and projects" = "getting-started/tasks-and-projects.md" },
