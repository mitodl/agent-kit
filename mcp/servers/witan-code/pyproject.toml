[project]
name = "witan-code"
version = "0.13.0"
description = "witan-code — tree-sitter code graph + cross-repo bridge (mounts under `witan code`)"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
keywords = ["mcp", "agent", "code-graph", "tree-sitter", "static-analysis", "coding-agent"]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "agent-config-kit>=0.4,<1",
    # `remote`: the ADR-0005 client stack (OIDC device grant + MCP-client
    # proxy) behind `witan-code login` and the read commands' remote mode.
    # Costs nothing extra in practice — fastmcp is already required here and
    # itself depends on httpx2, the extra's only other dependency.
    # >=0.12: remote/store.py imports RemotePayloadTooLarge and
    # payload_too_large from witan_core.remote.proxy at module scope, and 0.11
    # exports neither. A looser floor lets an external install resolve a
    # witan-core the server cannot even import; that is what this pin is for,
    # and it has now been tripped THREE times. If you add a witan_core symbol in
    # the same change as its caller, bump this line in that change: the
    # workspace resolves witan-core by path, so nothing here can catch it.
    # (>=0.19 is the ODD ONE OUT: nothing here imports a new symbol, so an
    # older witan-core still starts. It is pinned because the failure is SILENT
    # — 0.18 and earlier start every tool-call span against ambient context
    # instead of the W3C context ToolHive puts in MCP `_meta`, so spans never
    # join the proxy's trace and the sampler re-rolls instead of inheriting.
    # Every other entry below is an import-or-AttributeError floor; this one is
    # a correctness floor, kept because telemetry that looks fine and answers
    # nothing is harder to catch than a crash;
    # >=0.17 for remote.proxy.RemoteWriteIndeterminate AND gateway_failure,
    # both imported at module scope by remote/store.py — so an older witan-core
    # fails at IMPORT, exactly like the cases above; it does not degrade into
    # retrying an indeterminate write, because the module holding that retry is
    # the one that fails to load. Worth pinning precisely because store.py is
    # the transport index writes actually go out on: the floor is what keeps a
    # published install from being dead on arrival rather than subtly wrong;
    # >=0.14 was required for remote.proxy.RemoteToolFailed, re-exported at
    # module scope by witan_code/remote/proxy.py and named by cli.py's cli();
    # >=0.11 for chunking.MCP_LOAD_MAX_BYTES, evaluated as a default argument;
    # >=0.10 for witan_core.chunking + load_batch, both moved up from this
    # package; >=0.9 for observability.middleware; >=0.8 for
    # OmnigraphClient.change_many with chunk_size.)
    "witan-core[cli,remote,observability]>=0.19,<1",
    "fastmcp>=3.4.2,<5",
    "cyclopts>=4,<5",
    # [targets.<name>] override models (config.py) — also transitively pulled
    # in by fastmcp, declared explicitly since config.py imports it directly.
    "pydantic>=2,<3",
    # RS256 signing for the GitHub App JWT the CI indexer exchanges for a
    # clone credential (github_app.py). Reaches the environment anyway via
    # fastmcp -> authlib -> joserfc, but that chain is nobody's contract: a
    # fastmcp release that drops authlib would break private-repo cloning at
    # runtime, in a CronJob, rather than at resolve time here.
    "joserfc>=1.0,<2",
    # Pinned to 0.25.x: tree-sitter 0.26.0 has a use-after-free in its pyo3 Node
    # binding that segfaults (exit 139) under the heavy .parent()/.children()
    # churn _walk_defs does on real-world-sized files — deterministically on the
    # 2nd-3rd parse in one process, so `witan-code index` on any real repo hard-
    # crashes. 0.25.0/0.25.1/0.25.2 are all crash-free with the same ABI-15
    # grammar wheels (0.24 rejects them: needs ABI 15 => ts>=0.24). Do NOT bump
    # to 0.26 until upstream fixes this. See tk-critical-indexer-segfaults and
    # https://github.com/tree-sitter/py-tree-sitter/issues/472 (upstream report).
    "tree-sitter>=0.25,<0.26",
    # Individual grammar wheels (not tree-sitter-language-pack): each returns a
    # standalone tree_sitter.Language usable with tree_sitter.Parser/Query. Pins
    # are tight on purpose — a grammar major can bump the ABI / binding (see the
    # language-pack 1.9 binding break). Adding a language = add its wheel here +
    # an entry in indexer._GRAMMAR_MODULES.
    "tree-sitter-python>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-bash>=0.25,<0.26",
    "tree-sitter-yaml>=0.7,<0.8",
    "tree-sitter-sql>=0.3,<0.4",
    "tree-sitter-hcl>=1.2,<1.3",
    "tree-sitter-go>=0.25,<0.26",
    "pyyaml>=6,<7",
    "tomli-w>=1,<2",
    "rich>=13",
]

[project.optional-dependencies]
# The io.modelcontextprotocol/tasks extension (SEP-2663), which lets a client
# poll a long `code_reindex` instead of holding the tool call open. Optional
# because it exists only for fastmcp 4.x while the pin above still spans 3.4.x,
# and because it pulls a Docket/Redis stack that the default in-process
# `memory://` backend does not need. server.py registers it when importable.
tasks = ["fastmcp-tasks>=4.0.0b1,<5"]

[project.urls]
Homepage = "https://github.com/mitodl/agent-kit/tree/main/mcp/servers/witan-code"
Repository = "https://github.com/mitodl/agent-kit"
Documentation = "https://github.com/mitodl/agent-kit/blob/main/mcp/servers/witan-code/README.md"
Issues = "https://github.com/mitodl/agent-kit/issues"

[project.scripts]
witan-code = "witan_code.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
# Dev/CI use the in-repo workspace copy so this always tests against the
# agent-config-kit version bumped alongside it — even before that version
# has actually landed on PyPI. Published wheels only see the PyPI-range
# dependency declared above.
agent-config-kit = { workspace = true }
witan-core = { workspace = true }

[dependency-groups]
# fastmcp-tasks: the `tasks` extra. Without it CI would only ever exercise the
# extension-absent branch, and `code_reindex`'s task declaration would go
# untested — the failure mode there is the server refusing to start at all.
# cryptography: test_github_app generates a throwaway RSA key so the JWT path
# is exercised for real rather than mocked. joserfc requires it at runtime, so
# this only makes an existing import explicit.
test = ["pytest>=8", "fastmcp-tasks>=4.0.0b1,<5", "cryptography"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["witan_code"]

[tool.bumpversion]
current_version = "0.13.0"
allow_dirty = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

# witan_code/queries/, witan_code/schema/, witan_code/queries_ts/,
# witan_code/skills/, and witan_code/extensions/ are all discovered
# automatically via packages = ["witan_code"] — including for a
# `uvx --from git+...` install, so `witan-code setup` can bundle them via
# agent_config_kit without any build-time bundling step. Hooks are bare CLI
# commands (session-init, reindex-hook, inject-context, checkpoint in
# witan_code/cli.py) rather than wrapper scripts, so there's no
# witan_code/hooks/ to bundle either. The omnigraph binary itself is fetched
# at install/runtime instead (see witan_code/setup.py) — so there is no
# witan_code/_bin/ to force-include.
