[project]
name = "witan-code"
version = "0.1.0"
description = "witan-code — tree-sitter code graph + cross-repo bridge (mounts under `witan code`)"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "fastmcp>=3.4.2,<4",
    "cyclopts>=4,<5",
    "tree-sitter>=0.25,<0.26",
    # 1.9+ returns a `builtins.Language` that `tree_sitter.Parser` rejects
    # ("argument 1 must be tree_sitter.Language") — breaks indexing in any fresh
    # resolve (uvx/uv tool). Pin to the 1.8 line, which returns tree_sitter.Language.
    "tree-sitter-language-pack>=1.8,<1.9",
    "pyyaml>=6,<7",
    "rich>=13",
]

[project.scripts]
witan-code = "witan_code.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["witan_code"]

# The MCP server and indexer read these sibling dirs at runtime via
# Path(__file__).parent.parent; force-include them in the wheel so uvx git
# installs work.
[tool.hatch.build.targets.wheel.force-include]
"queries" = "queries"
"schema" = "schema"
