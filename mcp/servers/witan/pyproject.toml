[project]
name = "witan-council"
version = "0.11.3"
description = "witan — agent memory, planning, and collaboration graph (work-coordination layer + umbrella CLI)"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
keywords = [
  "mcp",
  "agent",
  "memory",
  "knowledge-graph",
  "task-tracking",
  "coding-agent",
]
classifiers = ["Programming Language :: Python :: 3"]
dependencies = [
  "fastmcp>=3.4.2,<5",
  "cyclopts>=4,<5",
  "rich>=13",
  "pydantic>=2,<3",
  "agent-config-kit>=0.4,<1",
  # >=0.12: witan/remote/proxy.py and witan/cli/__init__.py import
  # witan_core.remote.proxy.RemotePayloadTooLarge at module scope, which 0.11
  # does not export. A looser floor lets an external install resolve a
  # witan-core the server cannot even import — the failure this pin exists to
  # prevent, and one it has now hit THREE times. If you add a witan_core symbol
  # in the same change as its caller, bump this line in that change: the
  # workspace resolves witan-core by path, so nothing here can catch it.
  # (>=0.11 was required for chunking.MCP_LOAD_MAX_BYTES; >=0.10 for
  # witan_core.chunking + load_batch + config_file.resolve_config_path; >=0.9
  # for observability.middleware; >=0.8 for OmnigraphClient.change_many.)
  "witan-core[cli,remote,observability]>=0.12,<1",
  "pyyaml>=6,<7",
  "tomli-w>=1,<2",
  # Direct import in witan/remote/oidc.py for the CLI's OIDC device-code
  # login (ADR 0005). Also fastmcp's own HTTP client dep (Pydantic's
  # httpx2 fork), relied on directly rather than adding classic httpx too.
  "httpx2>=2.5",
]

[project.urls]
Homepage = "https://github.com/mitodl/agent-kit/tree/main/mcp/servers/witan"
Repository = "https://github.com/mitodl/agent-kit"
Documentation = "https://github.com/mitodl/agent-kit/blob/main/mcp/servers/witan/README.md"
Issues = "https://github.com/mitodl/agent-kit/issues"

[project.scripts]
witan = "witan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
# Dev/CI use the in-repo workspace copy so this always tests against the
# agent-config-kit version bumped alongside it — even before that version
# has actually landed on PyPI. Published wheels only see the PyPI-range
# dependency declared above.
agent-config-kit = { workspace = true }
witan-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["witan"]

# queries/ and schema/ live outside the witan/ package directory; force-include
# them so `uv tool install` / uvx git installs find them at runtime.
# witan/skills/, witan/hooks/, witan/extensions/ are already discovered via
# packages = ["witan"] and must NOT appear here to avoid the duplicate-path
# build error hatchling raises. The omnigraph binary is no longer
# build-time-bundled — `witan setup` fetches it at install/runtime instead
# (see witan/setup.py) — so there is no witan/_bin/ to force-include either.
[tool.hatch.build.targets.wheel.force-include]
"queries" = "queries"
"schema" = "schema"

[tool.bumpversion]
current_version = "0.10.0"
allow_dirty = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[dependency-groups]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "perf: loose latency guardrails; excludable on slow/contended runners with -m 'not perf'",
]
