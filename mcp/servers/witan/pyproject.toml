[project]
name = "witan"
version = "0.1.0"
description = "witan — agent memory, planning, and collaboration graph (work-coordination layer + umbrella CLI)"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "fastmcp>=3.4.2,<4",
    "cyclopts>=4,<5",
    "rich>=13",
]

[project.scripts]
witan = "witan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
# Downloads the omnigraph binary for the current platform during pip install / uvx.
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["witan"]

# config.py reads these sibling dirs at runtime via Path(__file__).parent.parent;
# force-include them in the wheel so `uv tool install` / uvx git installs work.
# witan/_bin/ is populated by the build hook above and checked first by OmnigraphClient.
[tool.hatch.build.targets.wheel.force-include]
"queries" = "queries"
"schema" = "schema"
"witan/_bin" = "witan/_bin"
"witan/skills" = "witan/skills"
"witan/hooks" = "witan/hooks"
"witan/extensions" = "witan/extensions"

[dependency-groups]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
