[project]
name = "witan-council"
version = "0.32.0"
description = "witan — agent memory, planning, and collaboration graph (work-coordination layer + umbrella CLI)"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
keywords = [
  "mcp",
  "agent",
  "memory",
  "knowledge-graph",
  "task-tracking",
  "coding-agent",
]
classifiers = ["Programming Language :: Python :: 3"]
dependencies = [
  "fastmcp>=4,<5",
  "cyclopts>=4,<5",
  "rich>=13",
  "pydantic>=2,<3",
  "agent-config-kit>=0.4,<1",
  # >=0.13: witan/graph.py imports witan_core.omnigraph.StoreUnavailable at
  # module scope, which 0.12 does not export. A looser floor lets an external
  # install resolve a witan-core the server cannot even import — the failure
  # this pin exists to prevent, and one it has now hit FIVE times. If you add a
  # witan_core symbol in the same change as its caller, bump this line in that
  # change: the workspace resolves witan-core by path, so nothing here can
  # catch it.
  #
  # ★ THE FIFTH TIME WAS #239, AND IT REACHED A USER. That PR added
  # `SessionLife` to witan-core and imported it from witan/remote/oidc.py in the
  # same change, bumping neither witan-core's version nor this floor. The
  # workspace resolved it by path so every test passed; a `uv tool install`
  # resolved published witan-core 0.20.0 and `witan login` died at import:
  #     ImportError: cannot import name 'SessionLife' from
  #     'witan_core.remote.oidc'
  # Hence >=0.21 below. Nothing in CI catches this — read the sentence above
  # before adding a witan_core symbol, because the tests will not tell you.
  #
  # ★ >=0.28 CONTINUES THE ONE ENTRY HERE THAT IS NOT ABOUT AN IMPORT. `edge`
  # moved again the day after 0.27.0's refresh; witan-core 0.28.0 carries the
  # new digest, and every version below it fails `witan setup`'s checksum and
  # installs no binary at all — witan/server.py bootstraps a graph at import
  # time, so the CLI is unusable rather than degraded. Same consequence as a
  # missing symbol, different cause. Expect this floor to keep moving while
  # omnigraph 0.10.0 stays on the moving `edge` tag; see
  # packages/witan-core/witan_core/omnigraph_install.py.
  #
  # (>=0.21 for remote.oidc.SessionLife, imported at module scope by
  # witan/remote/oidc.py and re-exported in its __all__;
  # >=0.20 for observability.trace_context_middleware, imported by
  # cli/__init__.py's serve() and passed to FastMCP as ASGI middleware — so an
  # older witan-core fails the import, exactly like every other entry here. It
  # is what adopts the caller's trace context from the HTTP header; without it
  # witan's spans start a rival root trace and the telemetry looks fine while
  # answering nothing.
  #
  # ★ The 0.19 floor in git history claimed to be an exceptional
  # "correctness floor" for a fix that did not work. Ignore that rationale;
  # >=0.17 for remote.proxy.RemoteWriteIndeterminate — imported at module
  # scope by witan/remote/proxy.py, re-exported there, and named in
  # cli/__init__.py's main() except-tuple, so an older witan-core fails the
  # import rather than degrading; >=0.16 for omnigraph_install.preserved_binaries, called by server.py's
  # _pre_upgrade_binary_candidates — it REPLACED preserved_binary, so an older
  # witan-core does not merely lack a helper, it AttributeErrors during
  # `witan migrate storage`, i.e. while recovering from a storage-format break.
  # The workspace resolves witan-core from the local path, so a stale floor is
  # invisible here and only bites a published install; >=0.14 was required for
  # remote.proxy.RemoteToolFailed, re-exported at
  # module scope by witan/remote/proxy.py and named by cli/__init__.py's
  # main(); >=0.13 for omnigraph.StoreUnavailable; >=0.12 for
  # remote.proxy.RemotePayloadTooLarge; >=0.11 for chunking.MCP_LOAD_MAX_BYTES;
  # >=0.10 for witan_core.chunking + load_batch + config_file.resolve_config_path;
  # >=0.9 for observability.middleware; >=0.8 for OmnigraphClient.change_many.)
  #
  # ★ >=0.22 IS THE FIRST BEHAVIOURAL FLOOR HERE, and it deliberately widens the
  # rule stated above. Every entry before it is an IMPORT floor: an older
  # witan-core fails to load and the failure is loud. This one imports fine and
  # is wrong quietly, which is why it is called out rather than appended to the
  # list.
  #
  # 0.22 makes an HTTP 409 (and the CLI's write-authority conflict) RETRYABLE.
  # `_retry_loop` raises `OmnigraphConflict` only for that classification, and
  # `task_claim` catches exactly that exception to re-read and answer
  # `{"claimed": false, "reason": "lost_race"}`. On 0.21 the classification is
  # FATAL, so that branch is unreachable and this package's DOCUMENTED CONTRACT
  # — a structured refusal, which ADR-0003 has parallel agents rely on — is
  # silently not honoured: measured at 6 of 8 racers getting an opaque
  # RuntimeError instead. Mutual exclusion still holds either way; what breaks
  # is the answer the losers get.
  #
  # So the floor is not "released alongside" bookkeeping: a published
  # witan-council on 0.21 ships a task_claim that cannot keep its promise.
  # Maintainer decision 2026-08-17 to pin it rather than let an external install
  # resolve that pair.
  # ★ >=0.23 IS AN IMPORT/ATTRIBUTE FLOOR, i.e. the ordinary kind, and it is the
  # exact case the paragraph at the top of this block warns about after five
  # occurrences: `server.py`'s `_update_task` calls
  # `client.read_with_commit(...)`, a method ADDED to witan-core in the same
  # change as its caller. On 0.22 that is an AttributeError on every task
  # update, not a soft degradation. The workspace resolves witan-core by path
  # so no test run in it catches this; only a published install does.
  #
  # ★ `just check-core-floor` NOW CATCHES THE IMPORT-TIME HALF, on ordinary PR
  # CI (.github/workflows/core-floor.yml): it installs this package's wheel into
  # a clean venv with witan-core pinned to exactly the floor below and imports
  # every module. It does NOT catch the BEHAVIOURAL floors below — an override
  # that is never called still imports fine — so those stay a judgement call and
  # keep their reasons written out.
  #
  # (0.23 also makes `recovery_required` on a write terminal instead of retried
  # and a 412 terminal — behaviour `task_claim` now depends on — but the
  # AttributeError above is what makes this floor mandatory rather than a
  # judgement call.)
  #
  # >=0.24 for the `sentry` extra requested above: 0.23 has no such extra
  # published, so anything resolving below 0.24 would silently install
  # without sentry-sdk (or error on the unknown extra) rather than getting
  # Sentry reporting at all.
  #
  # ★ >=0.25 IS A BEHAVIOURAL FLOOR, same category as >=0.22 above: 0.24's
  # `change()` always returns `None` for the commit its own write produced.
  # `task_claim`'s post-write verification uses that value as the floor its
  # catch-up retry compares a fresh re-read against — with `None` the retry
  # never engages, and verification silently falls back to a single
  # unconstrained read with no freshness guarantee, i.e. exactly
  # tk-mutual-exclusion-violated-2-of-8-racers-both-got-52b3dd's original
  # failure mode. No AttributeError, no test failure — a published
  # witan-council on 0.24 just quietly ships the bug this floor exists to
  # keep fixed.
  #
  # ★ >=0.29 IS A BEHAVIOURAL FLOOR, the same quiet kind as >=0.22 and >=0.25.
  # `RemoteServerProxy._repo_means_detect` overrides a base method that 0.28
  # does not define, so on 0.28 the override is simply never called: nothing
  # fails to import, no test fails, and the proxy goes back to injecting a
  # detected `repo` into `memory_update` / `task_update` — issue #268, where a
  # memory edited from another checkout silently re-scopes out of the repo it
  # documents. A published witan-council on 0.28 ships the bug this floor
  # exists to keep fixed, and the data loss is invisible at the call site.
  #
  # ★ >=0.30 IS A BEHAVIOURAL FLOOR, the same quiet kind as >=0.22, >=0.25 and
  # >=0.29 — and the third time this exact override-a-method-that-does-not-exist
  # shape has appeared, so read the >=0.29 note above before assuming this one
  # is bookkeeping. `RemoteServerProxy._branch_means_checkout` and
  # `_resolve_branch` override base methods that 0.29 does not define, so on
  # 0.29 they are simply never called: nothing fails to import, no test fails,
  # and the proxy stops sending the caller's git branch. `task_claim` then falls
  # back to reading `current_branch()` server-side, which in a container answers
  # nothing, and the CodeBranch/WorksOn edge is silently not written — the whole
  # of tk-task-claim-never-writes-the-codebranch-workson-e-9496c4, returned. It
  # leaves no error behind either time, because the skip is an early return and
  # not the failure path.
  #
  # (This also carries 0.21.0's >=0.28 reason forward: the refreshed omnigraph
  # `edge` digest, below which `witan setup` fails its checksum and leaves the
  # CLI with no binary. Subsumed, not dropped.)
  #
  # ★ >=0.32 IS A RUNTIME FLOOR, and a worked example of what
  # `just check-core-floor` cannot see. `cli/setup_cmd.py` calls
  # `install_omnigraph(dry_run, strict=False)`; anything below 0.32 has no
  # `strict` parameter, so that is a TypeError raised WHEN SETUP RUNS — the
  # module imports fine, every test passes, and the clean-install import check
  # is green. Nothing catches this but the pin, which is why the pin says so.
  #
  # The number is 0.32 and not the 0.31 this branch was authored against:
  # agent-kit#276 took 0.31.0 while this was open, so the release carrying
  # `strict` is the next one up. Re-check this line by hand on every rebase —
  # a floor left one release low here is a `witan setup` that dies with a
  # TypeError, and nothing in CI would have told you.
  "witan-core[cli,remote,observability,sentry]>=0.32,<1",
  "pyyaml>=6,<7",
  "tomli-w>=1,<2",
  # Direct import in witan/remote/oidc.py for the CLI's OIDC device-code
  # login (ADR 0005). Also fastmcp's own HTTP client dep (Pydantic's
  # httpx2 fork), relied on directly rather than adding classic httpx too.
  "httpx2>=2.5",
]

[project.urls]
Homepage = "https://github.com/mitodl/agent-kit/tree/main/mcp/servers/witan"
Repository = "https://github.com/mitodl/agent-kit"
Documentation = "https://github.com/mitodl/agent-kit/blob/main/mcp/servers/witan/README.md"
Issues = "https://github.com/mitodl/agent-kit/issues"

[project.scripts]
witan = "witan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
# Dev/CI use the in-repo workspace copy so this always tests against the
# agent-config-kit version bumped alongside it — even before that version
# has actually landed on PyPI. Published wheels only see the PyPI-range
# dependency declared above.
agent-config-kit = { workspace = true }
witan-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["witan"]

# queries/ and schema/ live outside the witan/ package directory; force-include
# them so `uv tool install` / uvx git installs find them at runtime.
# witan/skills/, witan/hooks/, witan/extensions/ are already discovered via
# packages = ["witan"] and must NOT appear here to avoid the duplicate-path
# build error hatchling raises. The omnigraph binary is no longer
# build-time-bundled — `witan setup` fetches it at install/runtime instead
# (see witan/setup.py) — so there is no witan/_bin/ to force-include either.
[tool.hatch.build.targets.wheel.force-include]
"queries" = "queries"
"schema" = "schema"

[tool.bumpversion]
current_version = "0.32.0"
allow_dirty = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[dependency-groups]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "perf: loose latency guardrails; excludable on slow/contended runners with -m 'not perf'",
]
filterwarnings = [
  # Six witan tools are coroutine functions. Calling one off the `witan.server`
  # module instead of the `server` fixture builds a coroutine nobody awaits, so
  # the call silently does NOTHING and the test keeps passing against setup that
  # was never created. That is not hypothetical — it is how
  # test_store_merge_rows_are_findable_by_search_not_just_readable ran on a
  # one-row corpus while its docstring explained why it must not.
  #
  # Deliberately narrow: this one message, not RuntimeWarning as a class, so an
  # unrelated warning from a future dependency cannot turn CI red.
  "error:coroutine .* was never awaited:RuntimeWarning",
  # The line above is not enough on its own. That RuntimeWarning is emitted when
  # the orphaned coroutine is garbage-collected, not inside the test body, so it
  # surfaces through the unraisable hook — where pytest re-wraps it in its own
  # class and the test still PASSES. Promoting the wrapper is what actually
  # fails the build.
  #
  # Message-qualified for the same reason as above, and it matters more here:
  # the wrapper class is generic, so promoting it wholesale would fail the run
  # on ANY unraisable exception — a dependency whose finalizer raises would turn
  # CI red for something no one here can fix. Verified in both directions: an
  # orphaned coroutine fails the run, while a `__del__` raising an unrelated
  # ValueError does not.
  #
  # Keyed on "coroutine" rather than pytest's full phrasing ("Exception ignored
  # while finalizing coroutine ...") so a reworded message in a future pytest
  # narrows the guard rather than silently disabling it.
  "error:.*coroutine:pytest.PytestUnraisableExceptionWarning",
]
