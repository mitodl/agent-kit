[project]
name = "witan"
version = "0.1.0"
description = "witan — agent memory, planning, and collaboration graph (work-coordination layer + umbrella CLI)"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "fastmcp>=3.4.2,<4",
    "cyclopts>=4,<5",
    "rich>=13",
    "pydantic>=2,<3",
]

[project.scripts]
witan = "witan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
# Downloads the omnigraph binary for the current platform during pip install / uvx.
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["witan"]

# queries/ and schema/ live outside the witan/ package directory; force-include
# them so `uv tool install` / uvx git installs find them at runtime.
# witan/_bin/, witan/skills/, witan/hooks/, witan/extensions/ are already
# discovered via packages = ["witan"] and must NOT appear here to avoid
# the duplicate-path build error hatchling raises.
[tool.hatch.build.targets.wheel.force-include]
"queries" = "queries"
"schema" = "schema"

[dependency-groups]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
