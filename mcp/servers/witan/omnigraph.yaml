# omnigraph.yaml — developer convenience aliases for running queries from the CLI.
# Note: this file format is deprecated as of omnigraph v0.7.0 (RFC-008).
# It still works but emits deprecation notices on stderr.
# Suppress with: export OMNIGRAPH_SUPPRESS_YAML_DEPRECATION=1
# The MCP server (graph.py) does NOT use this file — it invokes the CLI directly.
# Migration path: omnigraph config migrate --write

project:
  name: Agent Memory

cli:
  # Override graph target via WITAN_MEMORY_URI or edit here.
  # local disk:   ~/.local/share/witan/graph.omni
  # local S3:     s3://omnigraph-local/agent-memory/
  # team remote:  http://omnigraph.internal:8080
  graph: ~/.local/share/witan/graph.omni
  branch: main
  output_format: json

query:
  roots:
    - queries
    - .

aliases:
  search:
    {
      command: query,
      query: queries/read.gq,
      name: search_by_repo,
      args: [query, repo],
    }
  facts:
    {
      command: query,
      query: queries/read.gq,
      name: get_project_facts,
      args: [repo],
    }
  patterns:
    {
      command: query,
      query: queries/read.gq,
      name: patterns_by_repo,
      args: [repo],
    }
  get: { command: query, query: queries/read.gq, name: get_memory, args: [slug] }
  store:
    {
      command: mutate,
      query: queries/mutations.gq,
      name: insert_memory,
      args: [slug, kind, title, content, author, created_at, updated_at],
    }
