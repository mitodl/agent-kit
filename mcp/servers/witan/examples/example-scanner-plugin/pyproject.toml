[project]
name = "witan-example-scanner-plugin"
version = "0.1.0"
description = "Example third-party witan.scanners plugin (ADR 0001 §D2)"
requires-python = ">=3.11"
dependencies = []

# Registering under the `witan.scanners` entry-point group is all a plugin
# needs to be picked up by witan's ScannerRegistry — no dependency on the
# `witan` package itself, since Scanner is a structural (duck-typed) protocol.
[project.entry-points."witan.scanners"]
acme_employee_id = "example_scanner_plugin:AcmeEmployeeIdScanner"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_scanner_plugin"]
