# witan v1 Cedar policy — server-level (applies_to: [cluster]).
#
# The only server-scoped action is `graph_list` (bound to
# Omnigraph::Server::"root"). Everyone who can authenticate may enumerate the
# graphs they might have access to; per-graph read/write is gated by the
# per-graph bundles (memory / code-graph / bridge). Server-scoped rules take no
# branch_scope.
#
# Model reminder (omnigraph docs/user/operations/policy.md): the policy model is
# allow-only — every rule is a permit, anything ungranted is denied by default.
# There is no `deny` key. Actor identity is resolved server-side from the matched
# bearer token, never from a client-supplied header/param/body.
#
# GROUP MEMBERSHIP IS TEMPLATED. The `act-*` ids below are illustrative. In the
# deployed cluster, ol-infrastructure populates `witan-users` from the Keycloak
# group/role claim (one act-<sub> per authenticated human) and `witan-ci` with
# the single non-human service actor. Keep the group NAMES identical across all
# four bundle files — only the membership lists are templated.
version: 1

groups:
  # All authenticated human users (populated from the Keycloak witan-users claim).
  witan-users: [act-alice, act-bob]
  # The one legitimate non-human/shared actor: main-branch code-graph writes,
  # bridge writes, and schema applies. See
  # tk-design-keycloak-jwt-omnigraph-per-user-actor-tok-728f0c.
  witan-ci: [act-svc-witan-ci]

rules:
  - id: all-actors-can-list-graphs
    allow:
      actors: { group: witan-users }
      actions: [graph_list]
  - id: ci-can-list-graphs
    allow:
      actors: { group: witan-ci }
      actions: [graph_list]
