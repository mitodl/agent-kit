# Declarative policy tests for the Layer-2.5 cross-repo bridge graph bundle.
# Run: omnigraph policy test --cluster policy --graph bridge \
#        --tests policy/tests/bridge.tests.yaml
version: 1
cases:
  - id: user-reads-bridge
    actor: act-alice
    action: read
    branch: main
    expect: allow
  - id: user-exports-bridge
    actor: act-alice
    action: export
    branch: main
    expect: allow
  - id: user-invokes-bridge
    actor: act-alice
    action: invoke_query
    expect: allow
  # `main` is the committed cross-repo projection — CI's, not a user's.
  - id: user-cannot-write-bridge-main
    actor: act-alice
    action: change
    branch: main
    expect: deny
  # But indexing a WIP git branch writes that branch's bindings here too, on a
  # repo-qualified view of its own (`act-<sub>/<repo-slug>/<branch>`). Without
  # these grants every developer's WIP index half-succeeds: per-repo graph
  # written, cross-repo bindings denied.
  - id: user-writes-own-bridge-view
    actor: act-alice
    action: change
    branch: act-alice/github_com_mitodl_ol-infrastructure/feature-x
    expect: allow
  - id: user-creates-own-bridge-view
    actor: act-alice
    action: branch_create
    target_branch: act-alice/github_com_mitodl_ol-infrastructure/feature-x
    expect: allow
  # Cross-principal reads stay open on the bridge for the same reason they do on
  # the per-repo graphs — see tests/code-graph.tests.yaml.
  - id: user-reads-another-users-bridge-view
    actor: act-bob
    action: read
    branch: act-alice/github_com_mitodl_ol-infrastructure/feature-x
    expect: allow
  # Deletion is the reaper's, not a user's (code-graph.policy.yaml header).
  - id: user-cannot-delete-bridge-view
    actor: act-bob
    action: branch_delete
    target_branch: act-alice/github_com_mitodl_ol-infrastructure/feature-x
    expect: deny
  - id: ci-reaps-stale-bridge-view
    actor: act-svc-witan-ci
    action: branch_delete
    target_branch: act-alice/github_com_mitodl_ol-infrastructure/feature-x
    expect: allow
  - id: ci-cannot-delete-bridge-main
    actor: act-svc-witan-ci
    action: branch_delete
    target_branch: main
    expect: deny
  - id: ci-reads-bridge
    actor: act-svc-witan-ci
    action: read
    branch: main
    expect: allow
  - id: ci-writes-bridge
    actor: act-svc-witan-ci
    action: change
    branch: main
    expect: allow
  # Schema is the MCP service's job — CI writes content but cannot redefine schema.
  - id: ci-cannot-schema-apply-bridge
    actor: act-svc-witan-ci
    action: schema_apply
    target_branch: main
    expect: deny
  # The service reads the bridge before migrating it.
  - id: service-reads-bridge
    actor: act-svc-witan
    action: read
    branch: main
    expect: allow
  - id: service-schema-applies-bridge
    actor: act-svc-witan
    action: schema_apply
    target_branch: main
    expect: allow
  - id: stranger-cannot-read-bridge
    actor: act-nobody
    action: read
    branch: main
    expect: deny

  # ── Break-glass maintenance (ADR-0005 path b) ──────────────────────────────
  # Same read + schema grant as the per-repo code graphs, for the same reason:
  # the bridge is derived by the indexer, so there is nothing here worth
  # hand-editing and no view whose owner Cedar can verify.
  - id: admin-reads-bridge
    actor: act-svc-witan-admin
    action: read
    branch: main
    expect: allow
  - id: admin-schema-applies-bridge
    actor: act-svc-witan-admin
    action: schema_apply
    target_branch: main
    expect: allow
  - id: admin-cannot-write-bridge
    actor: act-svc-witan-admin
    action: change
    branch: main
    expect: deny
  - id: admin-cannot-delete-a-users-bridge-view
    actor: act-svc-witan-admin
    action: branch_delete
    target_branch: act-alice/mitodl-ol-django/feature-x
    expect: deny
