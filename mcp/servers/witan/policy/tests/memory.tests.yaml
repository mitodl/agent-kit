# Declarative policy tests for the Layer-1 shared work/knowledge graph bundle.
# Run: omnigraph policy test --cluster policy --graph memory \
#        --tests policy/tests/memory.tests.yaml
version: 1
cases:
  - id: user-reads-memory
    actor: act-alice
    action: read
    branch: main
    expect: allow
  - id: user-invokes-memory
    actor: act-alice
    action: invoke_query
    expect: allow
  # Flat shared graph — humans write the (single) main branch directly.
  - id: user-writes-memory-main
    actor: act-alice
    action: change
    branch: main
    expect: allow
  # Schema migrations are owned by the MCP service (witan-service), not users
  # and not the code-graph CI pipeline.
  - id: user-cannot-schema-apply-memory
    actor: act-bob
    action: schema_apply
    target_branch: main
    expect: deny
  - id: service-reads-memory
    actor: act-svc-witan
    action: read
    branch: main
    expect: allow
  - id: service-schema-applies-memory
    actor: act-svc-witan
    action: schema_apply
    target_branch: main
    expect: allow
  # The code-graph CI pipeline has no role on the work graph at all.
  - id: ci-has-no-memory-access
    actor: act-svc-witan-ci
    action: read
    branch: main
    expect: deny
  - id: stranger-cannot-read-memory
    actor: act-nobody
    action: read
    branch: main
    expect: deny

  # ── Break-glass maintenance (ADR-0005 path b) ──────────────────────────────
  # This is the graph the admin principal has real power on, and these cases are
  # what "only the maintenance verbs it needs" resolves to once `witan migrate
  # topics` / `repo-keys` / `merge` are the operations being authorized: they
  # rewrite existing rows, so `change` is not optional. It buys nothing a human
  # user does not already hold here (see the bundle header) — except schema.
  - id: admin-reads-memory
    actor: act-svc-witan-admin
    action: read
    branch: main
    expect: allow
  - id: admin-invokes-memory
    actor: act-svc-witan-admin
    action: invoke_query
    expect: allow
  - id: admin-writes-memory
    actor: act-svc-witan-admin
    action: change
    branch: main
    expect: allow
  - id: admin-schema-applies-memory
    actor: act-svc-witan-admin
    action: schema_apply
    target_branch: main
    expect: allow
  # Not granted anywhere, to anyone, on this graph: nothing about maintenance
  # needs to delete the single branch the whole work graph lives on.
  - id: admin-cannot-delete-memory-main
    actor: act-svc-witan-admin
    action: branch_delete
    target_branch: main
    expect: deny
