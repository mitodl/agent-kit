# Declarative policy tests for the Layer-2 per-repo code-graph bundle.
# Run: omnigraph policy test --cluster policy --graph code_example \
#        --tests policy/tests/code-graph.tests.yaml
version: 1
cases:
  # Humans: read anywhere, reindex WIP, never touch protected main.
  - id: user-reads-main
    actor: act-alice
    action: read
    branch: main
    expect: allow
  - id: user-reads-wip
    actor: act-alice
    action: read
    branch: feature-x
    expect: allow
  - id: user-invokes-query
    actor: act-alice
    action: invoke_query
    expect: allow
  - id: user-writes-wip
    actor: act-alice
    action: change
    branch: feature-x
    expect: allow
  - id: user-cannot-write-main
    actor: act-alice
    action: change
    branch: main
    expect: deny
  - id: user-creates-wip-branch
    actor: act-bob
    action: branch_create
    target_branch: feature-y
    expect: allow
  - id: user-cannot-create-main
    actor: act-bob
    action: branch_create
    target_branch: main
    expect: deny
  # Deleting a branch view on a shared graph is the reaper's job, not a user's:
  # views are named for their writer, but Cedar cannot scope a delete to that
  # writer, so the grant would be "any user may destroy any user's index".
  - id: user-cannot-delete-own-wip-branch
    actor: act-alice
    action: branch_delete
    target_branch: act-alice/feature-x
    expect: deny
  - id: user-cannot-delete-others-wip-branch
    actor: act-bob
    action: branch_delete
    target_branch: act-alice/feature-x
    expect: deny
  - id: user-cannot-merge-to-main
    actor: act-bob
    action: branch_merge
    target_branch: main
    expect: deny
  - id: user-cannot-schema-apply
    actor: act-bob
    action: schema_apply
    target_branch: main
    expect: deny

  # svc-witan-ci: owns the protected main index.
  - id: ci-reads-main
    actor: act-svc-witan-ci
    action: read
    branch: main
    expect: allow
  - id: ci-reads-wip
    actor: act-svc-witan-ci
    action: read
    branch: feature-x
    expect: allow
  - id: ci-writes-main
    actor: act-svc-witan-ci
    action: change
    branch: main
    expect: allow
  - id: ci-merges-to-main
    actor: act-svc-witan-ci
    action: branch_merge
    target_branch: main
    expect: allow
  # Schema is the MCP service's job — the reindex pipeline cannot redefine it.
  - id: ci-cannot-schema-apply-main
    actor: act-svc-witan-ci
    action: schema_apply
    target_branch: main
    expect: deny
  # CI reaps stale WIP branches but must NEVER delete the protected main index.
  - id: ci-deletes-wip
    actor: act-svc-witan-ci
    action: branch_delete
    target_branch: feature-x
    expect: allow
  - id: ci-cannot-delete-main
    actor: act-svc-witan-ci
    action: branch_delete
    target_branch: main
    expect: deny

  # witan-service: owns the code-graph schema on protected main.
  - id: service-reads-code
    actor: act-svc-witan
    action: read
    branch: main
    expect: allow
  - id: service-schema-applies-main
    actor: act-svc-witan
    action: schema_apply
    target_branch: main
    expect: allow
  # The service owns schema, not data — it cannot merge WIP into main.
  - id: service-cannot-merge-to-main
    actor: act-svc-witan
    action: branch_merge
    target_branch: main
    expect: deny

  # ── Per-writer branch views (witan_code/views.py) ────────────────────────
  # Views are named `act-<sub>/<branch>`. To Cedar these are just unprotected
  # branch names — it has no branch-name predicate — so the cases below pin
  # what that actually decides, in both directions.

  # READS STAY OPEN ACROSS PRINCIPALS. This is not incidental: per-user views
  # live on the shared cluster graph precisely so an agent can read a
  # teammate's in-flight index as it is written (DECIDED 2026-07-31, see
  # docs/adr/0006). A later tightening that scoped reads to the caller's own
  # views would defeat the reason the shared service exists — these cases are
  # here to make that tightening fail loudly rather than land quietly.
  - id: user-reads-own-view
    actor: act-alice
    action: read
    branch: act-alice/feature-x
    expect: allow
  - id: user-reads-another-users-view
    actor: act-bob
    action: read
    branch: act-alice/feature-x
    expect: allow
  - id: ci-reads-a-users-view
    actor: act-svc-witan-ci
    action: read
    branch: act-alice/feature-x
    expect: allow
  - id: user-writes-own-view
    actor: act-alice
    action: change
    branch: act-alice/feature-x
    expect: allow
  # A user's view of their own default branch is `act-<sub>/main`, which is a
  # DIFFERENT branch from the store's `main`: it is a private reindex of the
  # default branch, not the canonical index. protected_branches matches exact
  # names, so it lands unprotected and its owner may write it — while the
  # canonical `main` stays CI-only (user-cannot-write-main, above).
  - id: user-writes-own-view-of-default-branch
    actor: act-alice
    action: change
    branch: act-alice/main
    expect: allow
  # KNOWN GAP, ASSERTED DELIBERATELY. `expect: allow` is not what we want — it
  # is what omnigraph 0.8.1 decides. A bundle rule compiles to a bare permit
  # with no `when {}` clause and the only branch predicate is
  # protected/unprotected/any, so "write views prefixed with your own actor id"
  # is inexpressible; witan-code's write guard (graph.py:owns_view) enforces it
  # client-side instead. When an omnigraph release adds a branch-name or
  # principal-attribute predicate, THIS CASE FAILS — which is the point. Fix it
  # by tightening the bundle and flipping this to deny, then update
  # docs/adr/0006 and the code-graph.policy.yaml header.
  - id: cedar-cannot-scope-wip-writes-to-owner
    actor: act-bob
    action: change
    branch: act-alice/feature-x
    expect: allow

  # Unknown actor: default-deny. Namespacing does not create authority — an
  # unauthenticated principal cannot reach a view merely by naming it after
  # someone who is authenticated.
  - id: stranger-cannot-read
    actor: act-nobody
    action: read
    branch: main
    expect: deny
  - id: stranger-cannot-read-a-users-view
    actor: act-nobody
    action: read
    branch: act-alice/feature-x
    expect: deny
  - id: stranger-cannot-write-a-users-view
    actor: act-nobody
    action: change
    branch: act-alice/feature-x
    expect: deny

  # ── Break-glass maintenance (ADR-0005 path b) ──────────────────────────────
  # Read + schema only. The denials below are the substance of the principal:
  # a code graph is re-derivable, so break-glass never needs to edit, promote,
  # or destroy one — and the admin token is the one credential in the cluster
  # that could otherwise do all three across every repo at once.
  - id: admin-reads-code-any-branch
    actor: act-svc-witan-admin
    action: read
    branch: act-alice/feature-x
    expect: allow
  - id: admin-schema-applies-code
    actor: act-svc-witan-admin
    action: schema_apply
    target_branch: main
    expect: allow
  - id: admin-cannot-write-code-main
    actor: act-svc-witan-admin
    action: change
    branch: main
    expect: deny
  # Not even a WIP view: the fix for a bad index is a reindex by its writer.
  - id: admin-cannot-write-a-users-view
    actor: act-svc-witan-admin
    action: change
    branch: act-alice/feature-x
    expect: deny
  # Promotion into the reviewed index stays CI's, with a git merge behind it.
  - id: admin-cannot-merge-into-code-main
    actor: act-svc-witan-admin
    action: branch_merge
    target_branch: main
    expect: deny
  # Cedar cannot tell whose view a delete targets, so granting this would make
  # the admin token a way to destroy any developer's in-flight index.
  - id: admin-cannot-delete-a-users-view
    actor: act-svc-witan-admin
    action: branch_delete
    target_branch: act-alice/feature-x
    expect: deny
