# policy/cluster.yaml — CI TEST HARNESS for the witan v1 Cedar policy bundle.
#
# This is NOT the deployed cluster config. It exists so `omnigraph policy
# validate` and `omnigraph policy test` can run in CI (see
# .github/workflows/witan-tests.yml, job: witan-policy) against representative
# graph ids without standing up real stores. It wires the four production bundle
# files (server/memory/code-graph/bridge .policy.yaml) onto three stub graphs:
#
#   memory        — Layer-1 shared work/knowledge graph
#   code_example  — one representative Layer-2 per-repo code graph
#   bridge        — Layer-2.5 cross-repo bridge graph
#
# The bundle *.policy.yaml files ARE the deliverable consumed by
# ol-infrastructure. In the deployed cluster, ol-infrastructure templates its
# own cluster.yaml that (a) enumerates the real graph ids — `memory`, `bridge`,
# and one `<sanitize_slug(repo)>` per indexed repo — and (b) lists every real
# code-graph id in code-graph's `applies_to`. The stub schema (schema/stub.pg)
# is deliberately trivial: Cedar binds to graph ids + branches, not schema shape.
version: 1

metadata:
  name: witan-policy-fixture

graphs:
  memory:
    schema: ./schema/stub.pg
    queries:
      find_node:
        file: ./find.gq
  code_example:
    schema: ./schema/stub.pg
    queries:
      find_node:
        file: ./find.gq
  bridge:
    schema: ./schema/stub.pg
    queries:
      find_node:
        file: ./find.gq

policies:
  # NOTE: server.policy.yaml (graph_list, applies_to: [cluster]) is deliberately
  # NOT wired here. omnigraph 0.8.1's `policy validate`/`policy test` load every
  # applied bundle under the per-graph engine (PolicyResourceKind::Graph) and
  #   (a) reject the server-scoped `graph_list` action ("move it to a server
  #       policy file"), and
  #   (b) fan a `[cluster]`-scoped bundle onto every graph, which then trips the
  #       "one bundle per graph scope" selector.
  # So a server bundle cannot coexist with per-graph bundles under the offline
  # CLI harness. The server bundle is validated by omnigraph-server at boot and
  # enforced at runtime; it is applied by ol-infrastructure's deployed
  # cluster.yaml. See policy/README.md § "Server-level bundle".
  memory_rules:
    file: ./memory.policy.yaml
    applies_to: [memory]
  # In production this list carries every per-repo code-graph id, not just the
  # fixture's single representative graph.
  code_rules:
    file: ./code-graph.policy.yaml
    applies_to: [code_example]
  bridge_rules:
    file: ./bridge.policy.yaml
    applies_to: [bridge]
