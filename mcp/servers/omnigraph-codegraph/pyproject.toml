[project]
name = "omnigraph-codegraph"
version = "0.1.0"
description = "Tree-sitter code-graph MCP server (Layer 2) backed by Omnigraph"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.3.1,<4",
    "cyclopts>=4,<5",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-language-pack>=1.8,<2",
]

[project.scripts]
omnigraph-codegraph = "omnigraph_codegraph.__main__:main"
omnigraph-codegraph-index = "omnigraph_codegraph.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["omnigraph_codegraph"]

# The MCP server and indexer read these sibling dirs at runtime via
# Path(__file__).parent.parent; force-include them in the wheel so uvx git
# installs work.
[tool.hatch.build.targets.wheel.force-include]
"queries" = "queries"
"schema" = "schema"
