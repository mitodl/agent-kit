[project]
name = "agent-config-kit"
version = "0.5.0"
description = "Unified MCP server, skill, and hook registration across coding-agent platforms"
license = "BSD-3-Clause"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
cli = ["cyclopts>=4,<5", "rich>=13"]

[project.scripts]
agent-kit = "agent_config_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_config_kit"]

[tool.bumpversion]
current_version = "0.5.0"
allow_dirty = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[dependency-groups]
test = ["pytest>=8", "cyclopts>=4,<5", "rich>=13"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
