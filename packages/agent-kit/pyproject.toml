[project]
name = "ol-agent-kit"
version = "0.1.3"
description = "Meta-package: installs the full mitodl agent-kit toolkit (agent-config-kit's agent-kit CLI + witan + witan-code)"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
keywords = ["mcp", "agent", "coding-agent", "meta-package"]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "agent-config-kit[cli]>=0.3.7",
    # Floored at the releases that speak MCP 2026-07-28 (MRTR elicitation, the
    # tasks extension, cacheable list results). Still no upper bound, so a fresh
    # install keeps picking up newer releases of either server automatically.
    "witan-council>=0.7.2",
    "witan-code>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/mitodl/agent-kit"
Repository = "https://github.com/mitodl/agent-kit"
Documentation = "https://github.com/mitodl/agent-kit/blob/main/packages/agent-kit/README.md"
Issues = "https://github.com/mitodl/agent-kit/issues"

[project.scripts]
# Re-exposed from the dependencies below so `uv tool install ol-agent-kit`
# has executables to shim — a package with no [project.scripts] of its own
# has nothing for `uv tool install` to expose, even with entry-point-bearing
# dependencies pulled in alongside it.
agent-kit = "agent_config_kit.cli:main"
witan = "witan.cli:main"
witan-code = "witan_code.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
# Until a sibling package's local version bump has actually been published to
# PyPI, resolve it from the in-repo uv workspace (`workspace = true`) so
# `uv sync` / CI build against the bumped source ahead of publish. Published
# wheels only see the PyPI-range dependency declared above (same pattern as
# mcp/servers/witan).
agent-config-kit = { workspace = true }
witan-council = { workspace = true }
witan-code = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["agent_kit"]

[tool.bumpversion]
current_version = "0.1.3"
allow_dirty = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[dependency-groups]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
