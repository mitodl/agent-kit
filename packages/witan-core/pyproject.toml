[project]
name = "witan-core"
version = "0.33.0"
description = "Shared core for the witan MCP servers (witan-council + witan-code)"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
keywords = ["mcp", "agent", "omnigraph", "shared", "coding-agent"]
classifiers = [
    "Programming Language :: Python :: 3",
]
# Base modules (_detach, repo_key, timeutil, omnigraph, maintenance) are
# stdlib-only on purpose so neither server pulls weight it doesn't use. Heavier
# concerns are gated behind the extras below.
dependencies = []

[project.optional-dependencies]
# cli.py (make_app/report_install/resolve_author) + the omnigraph installer's
# styled output. agent-config-kit supplies resolve_version (--version wiring)
# and the InstallResult type report_install prints; it is a sibling leaf package
# both servers already depend on, so this stays a valid leaf→leaf edge.
cli = ["cyclopts>=4,<5", "rich>=13", "agent-config-kit>=0.4,<1"]
# elicit.py (fastmcp.server.elicitation.AcceptedElicitation).
mcp = ["fastmcp>=4,<5"]
# remote/ — the OIDC device-auth + token cache (httpx2) and the MCP-client proxy
# (fastmcp). ADR-0005 path-a client stack; a server's CLI uses it to reach its
# deployed self. fastmcp 4.x itself depends on httpx2 (Pydantic's maintained
# fork of httpx), not classic httpx, so this stays the one HTTP client in the
# dependency tree instead of adding a second.
remote = ["httpx2>=2.5", "fastmcp>=4,<5"]
# observability/ — structlog config + OpenTelemetry, patterned after
# mitol-django-observability. structlog is the hard requirement; the OTel halves
# are imported defensively so a install that wants structured logs without an
# exporter still works. Deliberately NOT in the base package: a local stdio
# session exports nothing, and an OTLP exporter is a lot of weight to carry for
# a `pip install witan-core`.
observability = [
    "structlog>=25",
    "opentelemetry-api>=1.31",
    "opentelemetry-sdk>=1.31",
    "opentelemetry-exporter-otlp-proto-http>=1.31",
]
# observability/telemetry.py::configure_sentry. Kept separate from
# `observability` rather than folded in: Sentry hooks the stdlib logging chain
# `observability` already sets up, not a new pipeline, so it needs nothing else
# from that extra — and a deployment that already ships Loki/Tempo via OTel may
# not want a second, SaaS error-tracking dependency pulled in by default.
#
# Capped below 3.0: sentry-sdk's 3.0 alpha line bundles its own
# opentelemetry-sdk dependency — a second, unrelated copy of the exact package
# `observability` above already pins and configures.
sentry = ["sentry-sdk>=2.20,<3"]

[project.urls]
Homepage = "https://github.com/mitodl/agent-kit/tree/main/packages/witan-core"
Repository = "https://github.com/mitodl/agent-kit"
Issues = "https://github.com/mitodl/agent-kit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["witan_core"]

[tool.bumpversion]
current_version = "0.33.0"
allow_dirty = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[dependency-groups]
# rich: the omnigraph installer imports it lazily; the installer tests exercise
# that path. fastmcp: witan_core.elicit + remote.proxy import it (the `mcp` /
# `remote` extras). cyclopts + agent-config-kit: the `cli` extra; the cli tests
# exercise make_app/report_install. httpx2: remote.oidc (the `remote` extra);
# the device-auth tests drive it via httpx2.MockTransport. All test-only — the
# base package requires none of them. structlog + opentelemetry: the
# `observability` extra; the tests assert on the rendered JSON and on which
# providers get installed. sentry-sdk: the `sentry` extra; the tests assert on
# configure_sentry's DSN gating and never-fatal behavior.
test = [
    "pytest>=8",
    "rich>=13",
    "fastmcp>=4,<5",
    "cyclopts>=4,<5",
    "agent-config-kit>=0.4,<1",
    "httpx2>=2.5",
    "structlog>=25",
    "opentelemetry-api>=1.31",
    "opentelemetry-sdk>=1.31",
    "opentelemetry-exporter-otlp-proto-http>=1.31",
    "sentry-sdk>=2.20,<3",
]

[tool.uv.sources]
# Resolve the sibling shared package from the monorepo checkout for local dev
# and CI; PyPI still serves it for external installs via the version range above.
agent-config-kit = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
