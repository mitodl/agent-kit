# `just bump witan-vscode <part>` reads this, as it reads [tool.bumpversion]
# in the Python packages' pyproject.toml. The searches are anchored on the
# neighbouring key because a bare `"version": "X"` also matches dependency
# entries in package-lock.json.
[tool.bumpversion]
current_version = "0.0.0"
# `just bump` collects changelog fragments before it bumps, so the tree is
# always dirty by the time bump-my-version runs.
allow_dirty = true
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "package.json"
search = "\"version\": \"{current_version}\",\n\t\"publisher\": \"mitol\""
replace = "\"version\": \"{new_version}\",\n\t\"publisher\": \"mitol\""

[[tool.bumpversion.files]]
filename = "package-lock.json"
search = "\"name\": \"witan\",\n\t\"version\": \"{current_version}\""
replace = "\"name\": \"witan\",\n\t\"version\": \"{new_version}\""

[[tool.bumpversion.files]]
filename = "package-lock.json"
search = "\"name\": \"witan\",\n\t\t\t\"version\": \"{current_version}\""
replace = "\"name\": \"witan\",\n\t\t\t\"version\": \"{new_version}\""
